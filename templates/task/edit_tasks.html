
{% extends "base.html" %}

{% block title %}Edit Task | EMS{% endblock %}

{% block content %}

<div class="page-header">
    <div>
        <h1>Edit Task</h1>
        <p>Update task details, assignment and progress.</p>
    </div>

    <a href="{{ url_for('tasks') }}" class="btn btn-secondary">
        Back to Tasks
    </a>
</div>

<div class="task-form-card">
    <form method="POST"
          action="{{ url_for('edit_task', task_id=task.task_id) }}">

        <div class="task-form-grid">

            <div class="form-group full-width">
                <label for="task_name">Task Name *</label>
                <input type="text" id="task_name" name="task_name"
                       value="{{ task.task_name }}" required>
            </div>

            <div class="form-group full-width">
                <label for="description">Description</label>
                <textarea id="description" name="description"
                          rows="4">{{ task.description or '' }}</textarea>
            </div>

            <div class="form-group">
                <label for="project_id">Project</label>
                <select id="project_id" name="project_id">
                    <option value="">No project assigned</option>
                    {% for project in projects %}
                        <option value="{{ project.project_id }}"
                            {% if task.project_id == project.project_id %}selected{% endif %}>
                            {{ project.project_name }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="emp_id">Assign Employee</label>
                <select id="emp_id" name="emp_id">
                    <option value="">No employee assigned</option>
                    {% for employee in employees %}
                        <option value="{{ employee.emp_id }}"
                            {% if task.emp_id == employee.emp_id %}selected{% endif %}>
                            {{ employee.name }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="due_date">Due Date</label>
                <input type="date" id="due_date" name="due_date"
                       value="{{ task.due_date or '' }}">
            </div>

            <div class="form-group">
                <label for="priority">Priority</label>
                <select id="priority" name="priority">
                    <option value="Low"
                        {% if task.priority == 'Low' %}selected{% endif %}>
                        Low
                    </option>
                    <option value="Medium"
                        {% if task.priority == 'Medium' %}selected{% endif %}>
                        Medium
                    </option>
                    <option value="High"
                        {% if task.priority == 'High' %}selected{% endif %}>
                        High
                    </option>
                </select>
            </div>

            <div class="form-group">
                <label for="status">Status</label>
                <select id="status" name="status">
                    <option value="Pending"
                        {% if task.status == 'Pending' %}selected{% endif %}>
                        Pending
                    </option>
                    <option value="In Progress"
                        {% if task.status == 'In Progress' %}selected{% endif %}>
                        In Progress
                    </option>
                    <option value="Completed"
                        {% if task.status == 'Completed' %}selected{% endif %}>
                        Completed
                    </option>
                </select>
            </div>

        </div>

        <div class="task-form-actions">
            <a href="{{ url_for('tasks') }}" class="btn btn-secondary">
                Cancel
            </a>

            <button type="submit" class="btn btn-primary">
                Update Task
            </button>
        </div>

    </form>
</div>

{% endblock %}
