
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Employee | EMS</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <aside class="sidebar">
        <h2>EMS</h2>
        <a href="/">Dashboard</a>
        <a class="active" href="/employees">Employees</a>
        <a href="/">Departments</a>
        <a href="/">Projects</a>
        <a href="/">Tasks</a>
    </aside>

    <main class="content">
        <h1>Edit Employee</h1>
        <p>Update employee ID: {{ employee.emp_id }}</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="alert {{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form class="form-card" method="POST">
            <div class="form-grid">
                <div class="field">
                    <label>Full Name *</label>
                    <input type="text" name="name"
                           value="{{ employee.name }}" required>
                </div>

                <div class="field">
                    <label>Email</label>
                    <input type="email" name="email"
                           value="{{ employee.email or '' }}">
                </div>

                <div class="field">
                    <label>Phone</label>
                    <input type="tel" name="phone"
                           value="{{ employee.phone or '' }}">
                </div>

                <div class="field">
                    <label>Hire Date</label>
                    <input type="date" name="hire_date"
                           value="{{ employee.hire_date or '' }}">
                </div>

                <div class="field">
                    <label>Job Title</label>
                    <input type="text" name="job_title"
                           value="{{ employee.job_title or '' }}">
                </div>

                <div class="field">
                    <label>Salary</label>
                    <input type="number" name="salary"
                           min="0" step="0.01"
                           value="{{ employee.salary if employee.salary is not none else '' }}">
                </div>

                <div class="field full-width">
                    <label>Department</label>
                    <select name="dept_id">
                        <option value="">Select Department</option>
                        {% for dept in departments %}
                        <option value="{{ dept.dept_id }}"
                            {% if employee.dept_id == dept.dept_id %}
                                selected
                            {% endif %}>
                            {{ dept.dept_name }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">
                    Update Employee
                </button>
                <a href="{{ url_for('employees') }}"
                   class="btn btn-cancel">Cancel</a>
            </div>
        </form>
    </main>
</body>
</html>
