<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Employee Management System{% endblock %}</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f1f5f9;
            color: #1e293b;
        }

        .navbar {
            background: #172554;
            color: white;
            padding: 18px 35px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .navbar h2 {
            font-size: 22px;
        }

        .nav-links {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 15px;
        }

        .nav-links a:hover {
            color: #93c5fd;
        }

        main {
            max-width: 1400px;
            margin: 30px auto;
            padding: 0 25px;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        .page-header h1 {
            margin-bottom: 8px;
        }

        .page-header p {
            color: #64748b;
        }

        .table-container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            overflow-x: auto;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 13px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }

        th {
            background: #eff6ff;
            color: #1e40af;
        }

        .btn {
            display: inline-block;
            border: none;
            border-radius: 6px;
            padding: 9px 13px;
            text-decoration: none;
            cursor: pointer;
            color: white;
            font-size: 14px;
        }

        .btn-primary {
            background: #2563eb;
        }

        .btn-edit {
            background: #f59e0b;
        }

        .btn-delete {
            background: #dc2626;
        }

        .status-badge {
            background: #dbeafe;
            color: #1d4ed8;
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 12px;
        }

        .action-buttons {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .action-buttons form {
            margin: 0;
        }

        .alert {
            padding: 12px 15px;
            margin-bottom: 15px;
            border-radius: 6px;
        }

        .alert-success {
            background: #dcfce7;
            color: #166534;
        }

        .alert-danger, .alert-error {
            background: #fee2e2;
            color: #991b1b;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin: 7px 0 15px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
        }

        @media (max-width: 600px) {
            .navbar {
                padding: 18px;
            }

            main {
                padding: 0 12px;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <h2>Employee Management System</h2>

        <div class="nav-links">
            <a href="/">Dashboard</a>
            <a href="{{ url_for('employees') }}">Employees</a>
            <a href="{{ url_for('department_list') }}">Departments</a>
            <a href="{{ url_for('projects') }}">Projects</a>
        </div>
    </nav>

    <main>
        {% block content %}
        {% endblock %}
    </main>

</body>
</html>
